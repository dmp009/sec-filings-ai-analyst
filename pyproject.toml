[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secanalyst"
version = "0.1.0"
description = "Analyst tool over SEC filings (10-K/10-Q) and XBRL data of 8 large S&P 500 companies."
requires-python = ">=3.11"
dependencies = [
  "requests",
  "pandas>=2.2",
  "numpy",
  "duckdb>=1.1",
  "pandera>=0.24",
  "pydantic>=2",
  "pyyaml",
  "beautifulsoup4",
  "lxml",
  "fastembed",
  "rank-bm25",
  "anthropic",
  "reportlab",
  "plotly",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pypdf"]

[tool.setuptools.packages.find]
include = ["secanalyst*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["realdata: runs over downloaded filings in data/raw (skipped when absent)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/Home.py" = ["N999"]
