# Red-flag radar. A passage is a hit when its Item is in `items` (all items when omitted), it
# matches one of `keywords` ("re:" prefix = regular expression, else a literal phrase on word
# boundaries) and none of `exclude` (regular expressions for boilerplate that shares the words).
# Keywords/items were refined against 40 hand-checked hits; see docs/design/risk-diligence-notes.md.
customer_concentration:
  items: ["1A", "7"]
  keywords:
    - "customer concentration"
    - "one customer accounted for"
    - "re:single customer (accounted|represent\\w*)"
    - "re:(small|limited) number of (customers|distributors|partners)"
    - "re:top (five|ten|\\d+) (end )?customers"
    - "re:(customers?|distributors?|partners?) (accounted|represent\\w*)( for)?( approximately)? \\d+(\\.\\d+)?%"
  seeds:
    - "One customer accounted for more than 10% of our total revenue during the fiscal year."
    - "A small number of customers represent a significant portion of our revenue and receivables."
    - "The loss of any of our largest customers could materially harm our business."
litigation:
  items: ["1A", "3", "8"]
  keywords:
    - "legal proceedings"
    - "class action"
    - "re:lawsuits?"
    - "re:antitrust (lawsuits?|litigation|investigations?|proceedings?|actions?|claims?|complaints?|cases?)"
    - "patent infringement"
    - "investigation by"
  seeds:
    - "We are subject to legal proceedings, including class action lawsuits and government investigations."
    - "An adverse outcome in antitrust or patent infringement litigation could require us to pay significant damages."
    - "Regulators have opened investigations into our business practices."
material_weakness:
  items: ["1A", "7", "9A"]
  keywords:
    - "re:material weakness(es)?"
    - "re:ineffective internal control"
    - "internal control over financial reporting was not effective"
    - "restatement"
    - "significant deficiency"
  exclude:
    - "risk that a material weakness exists"
    - "no material weakness"
    - "Identification of material weakness"
  seeds:
    - "We identified a material weakness in our internal control over financial reporting."
    - "Management concluded that internal control over financial reporting was not effective."
    - "We may be required to restate our financial statements."
going_concern:
  items: ["1A", "7"]
  keywords: ["going concern", "substantial doubt", "insufficient liquidity", "covenant default"]
  seeds:
    - "There is substantial doubt about our ability to continue as a going concern."
    - "If we cannot raise additional capital, we may not have sufficient liquidity to fund operations."
    - "A default under our debt covenants could accelerate repayment of our indebtedness."
china_geopolitics:
  items: ["1A"]
  keywords: ["china", "chinese", "PRC", "taiwan", "hong kong", "mainland china"]
  seeds:
    - "Our operations and supply chain in China and Taiwan expose us to geopolitical and trade tensions."
    - "Tariffs and retaliatory trade measures between the United States and China could harm our results."
    - "Military conflict or political instability in Taiwan could disrupt our manufacturing partners."
ai_regulation:
  items: ["1A"]
  keywords:
    - "re:\\b(EU|European Union.s|European) (Artificial Intelligence Act|AI Act)"
    - "re:regulat\\w+ (of|on|governing) (artificial intelligence|AI)\\b"
    - "re:(artificial intelligence|AI) (laws?|regulations?|legislation)"
    - "re:(laws?|regulations?|legislation|rules) (that )?(govern\\w*|relat\\w+ to|regarding|concerning|on) (the use of |the development of )?(artificial intelligence|AI)\\b"
  seeds:
    - "New laws and regulations governing artificial intelligence, such as the EU AI Act, could increase our compliance costs."
    - "Evolving regulation of AI technologies may restrict how we develop and deploy our products."
    - "Concerns about bias, safety or misuse of AI could result in regulatory scrutiny and reputational harm."
export_controls:
  items: ["1A", "7"]
  keywords:
    - "export control"
    - "export restrictions"
    - "export administration regulations"
    - "license requirement"
    - "entity list"
    - "re:(economic|trade|U\\.S\\.|international) sanctions"
  seeds:
    - "U.S. export controls restrict our ability to sell advanced products to customers in certain countries."
    - "New license requirements could prevent us from shipping products to China and other markets."
    - "Our customers or suppliers may be added to the Entity List, disrupting our sales."
cybersecurity:
  items: ["1A", "1C"]
  keywords:
    - "re:cyber[- ]?attacks?"
    - "data breach"
    - "ransomware"
    - "security incident"
    - "security breach"
    - "re:cybersecurity (incidents?|threats?|risks?|attacks?|breach\\w*)"
    - "re:unauthorized access to (our|its|the Company.s) (systems|networks|data|information)"
  seeds:
    - "We have experienced and may continue to experience cyber attacks and security incidents."
    - "A data breach could expose confidential customer information and result in liability and reputational damage."
    - "Ransomware and other malicious attacks could disrupt our operations and systems."
