revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, SalesRevenueNet]
cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold, CostOfGoodsSold]
gross_profit: [GrossProfit]
operating_income: [OperatingIncomeLoss]
net_income: [NetIncomeLoss, ProfitLoss]
depreciation_amortization: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet, DepreciationAmortizationAndImpairment]
# D&A fallback when no combined tag is reported: depreciation + amortization of intangibles
depreciation: [Depreciation]
amortization_intangibles: [AmortizationOfIntangibleAssets]
operating_cash_flow: [NetCashProvidedByUsedInOperatingActivities]
capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
sbc: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]
total_assets: [Assets]
total_equity: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
# total_debt and cash_short_term_investments are documented FALLBACKS only; design 9.4 builds
# them from the component concepts below.
total_debt: [DebtLongtermAndShorttermCombinedAmount, LongTermDebt, DebtAndCapitalLeaseObligations, LongTermDebtAndCapitalLeaseObligations]
cash_short_term_investments: [CashCashEquivalentsAndShortTermInvestments, CashAndCashEquivalentsAtCarryingValue]
receivables: [AccountsReceivableNetCurrent, ReceivablesNetCurrent]
inventory: [InventoryNet]
payables: [AccountsPayableCurrent, AccountsPayableTradeCurrent, AccountsPayableAndAccruedLiabilitiesCurrent]
income_tax: [IncomeTaxExpenseBenefit]
pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
# Components for design 9.4 (total debt, liquidity)
short_term_borrowings: [ShortTermBorrowings]
commercial_paper: [CommercialPaper]
debt_current: [LongTermDebtCurrent, DebtCurrent]
# LongTermDebtAndCapitalLeaseObligations (Broadcom) already includes non-current finance leases
debt_noncurrent: [LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations, LongTermDebt]
finance_lease_liability_current: [FinanceLeaseLiabilityCurrent]
finance_lease_liability_noncurrent: [FinanceLeaseLiabilityNoncurrent]
# Total finance-lease liability: added to debt only when neither split component is tagged (Microsoft)
finance_lease_liability_total: [FinanceLeaseLiability]
cash_and_equivalents: [CashAndCashEquivalentsAtCarryingValue]
short_term_investments: [ShortTermInvestments, AvailableForSaleSecuritiesDebtSecuritiesCurrent, MarketableSecuritiesCurrent]
# LongTermInvestments is deliberately excluded (Microsoft: mostly equity-method / non-marketable equity)
marketable_securities_noncurrent: [MarketableSecuritiesNoncurrent, AvailableForSaleSecuritiesDebtSecuritiesNoncurrent]
# Liquidity fallback only when neither short- nor long-term securities are tagged (NVIDIA FY2026)
marketable_securities_total: [AvailableForSaleSecuritiesDebtSecurities]
# Cash equivalents inside cash; subtracted from marketable_securities_total (AFS overlap)
cash_equivalents: [CashEquivalentsAtCarryingValue]
